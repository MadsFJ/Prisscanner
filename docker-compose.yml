services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prisscanner
      POSTGRES_PASSWORD: prisscanner
      POSTGRES_DB: prisscanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisscanner"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
